

spring.application.name=ingestion-service
spring.kafka.bootstrap-servers=localhost:9092
spring:
kafka:
bootstrap-servers: localhost:9092
producer:
key-serializer: org.apache.kafka.common.serialization.StringSerializer
value-serializer: org.apache.kafka.common.serialization.StringSerializer
consumer:
group-id: test-group
key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
src/main/java/com/dharani/ingestion/service/
auto.offset.reset: earliest

# Elasticsearch connection (adjust if your ES is elsewhere)
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=3s
spring.elasticsearch.socket-timeout=3s

# Optional: log requests
logging.level.org.springframework.data.elasticsearch=INFO

